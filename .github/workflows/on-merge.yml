name: On merge to -jahia forked branches

on:
  push:
    branches:
      - '**-jahia'
    tags-ignore:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and deploy snapshot
    steps:
    - uses: actions/checkout@v3
    - name: Set environment variables from parameters
      shell: bash
      run: |
        echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> $GITHUB_ENV
        echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> $GITHUB_ENV
    - uses: actions/cache@v1
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK 1.8
      uses: actions/setup-java@v3
      with:
        java-version: 1.8
        distribution: 'temurin'
    - name: Build with Maven
      run: mvn -s .github/maven.settings.xml install deploy -Papache-release -Dmaven.test.skip=false -Dmaven.javadoc.skip=true -Dgpg.skip=true --file pom.xml