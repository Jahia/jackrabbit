name: On merge to -jahia forked branches

on:
  push:
    branches:
      - '**-jahia'
    tags-ignore:
      - '**'

jobs:
  build:
    name: Build module
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
    - name: Set environment variables from parameters
      shell: bash
      run: |
        echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> $GITHUB_ENV
        echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> $GITHUB_ENV
    - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: 11
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven
      run: mvn -s .github/maven.settings.xml -ntp -B -Papache-release -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true -Drat.skip=true --file pom.xml install

  publish:
    name: Publish module
    needs: [ build ]
    if: github.ref == 'refs/heads/2.22-jahia'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
    - name: Set environment variables from parameters
      shell: bash
      run: |
        echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> $GITHUB_ENV
        echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> $GITHUB_ENV
    - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: 11
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven
      run: | 
        mvn -s .github/maven.settings.xml -ntp -B -Papache-release -Dmaven.test.skip=false -Dmaven.javadoc.skip=true -Dgpg.skip=true -Drat.skip=true --file pom.xml \
        clean deploy
